[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evemtbench"
version = "1.0.0"
description = "EvEMTBench: a protocol-driven ML benchmark for power system protection on EMT waveform data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Julian Oelhaf" },
    { name = "Georg Kordowich" },
]
keywords = ["power-systems", "protection", "machine-learning", "benchmark", "EMT", "waveform"]

# NOTE: exact versions are pinned in requirements.lock (the reproducibility contract),
# not here. These are the import-level dependencies of the package.
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pyarrow>=12",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Deep-learning baselines + Hydra-driven runner (Steps 3-4). Kept optional so the
# evaluation layer (the product) installs without a heavy torch dependency.
torch = ["torch>=2.0"]
hydra = ["hydra-core>=1.3"]
baselines = ["torch>=2.0", "hydra-core>=1.3", "xgboost>=2.0", "matplotlib>=3.7", "wandb>=0.16"]
# 'contract' pulls the light dep used to validate windowed data / the vendored contract
# schemas (tests/integration/test_contract_conformance.py).
contract = ["jsonschema>=4.18"]
# 'graphs' pulls networkx for topology-graph loading (data/graphs.py); imported lazily so the core
# product layer stays graph-free. Needed for the GNN / cross-topology direction.
graphs = ["networkx>=3.0"]
# 'tracking' pulls Weights & Biases for the optional ONLINE experiment-logging channel (guarded by
# EVEMTBENCH_WANDB; imported lazily in baselines/_tracking.py so the core product stays tracker-free).
tracking = ["wandb>=0.16"]
dev = [
    "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "jsonschema>=4.18", "networkx>=3.0",
]

[project.scripts]
evemtbench-evaluate = "evemtbench.evaluation.cli:main"
evemtbench-run = "evemtbench.baselines.runner:main"
evemtbench-splits = "evemtbench.splits.generator:main"
evemtbench-leaderboard = "evemtbench.leaderboard:main"
evemtbench-significance = "evemtbench.evaluation.significance:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Committed split files + the vendored contract artifacts travel with the package.
evemtbench = [
    "splits/**/*.txt", "splits/**/*.json", "configs/**/*.yaml",
    "contract/*.json", "contract/CONTRACT_VERSION",
    "baselines/*.schema.json",  # run_record provenance schema (validated by integrity checks)
    "data/input_digests.json",  # digest pins for the windowed inputs (verified by integrity)
    "py.typed",  # PEP 561: ship types to downstream users
]

[tool.pytest.ini_options]
addopts = "-ra -m 'not data_integrity'"
testpaths = ["tests"]
markers = [
    "integration: cross-module tests (run in CI)",
    "data_integrity: requires the real cluster dataset; excluded from CI",
    "golden: frozen settings-row -> label expectations",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "hpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# leaderboard.py / make_audit.py embed CSS/JS/HTML string literals where line length is
# not meaningful; the paper_artifacts builders embed LaTeX table/caption literals (same rationale)
"src/evemtbench/leaderboard.py" = ["E501"]
"hpc/make_audit.py" = ["E501"]
"hpc/paper_artifacts/*.py" = ["E501"]

[tool.coverage.run]
source = ["evemtbench"]

[tool.coverage.report]
# Measured-then-pinned floor (torch-free CI environment measured 71% on 2026-07-07; with torch
# the same suite reports 89%). Ratchet rule (CONTRIBUTING.md): raise to the CI-reported figure
# minus one point after a stable week; never lower without a dated lessons.md entry.
fail_under = 70

[tool.mypy]
python_version = "3.10"
packages = ["evemtbench"]
ignore_missing_imports = true

# Strictness ratchet: new modules join this list at birth (CONTRIBUTING.md); global strict is a
# backlog item.
[[tool.mypy.overrides]]
module = ["evemtbench.integrity", "evemtbench.coverage"]
disallow_untyped_defs = true
