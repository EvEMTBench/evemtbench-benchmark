name: nightly

# Scheduled full gate on FRESH runners — catches what the push-gate structurally cannot:
# dependency/runner drift (the push-gate reuses caches and only fires on changes), and
# time-dependent flakiness. Mirrors the fast gate's steps 1:1 so a nightly red means "the world
# changed under us", never "the workflow differs". Data-bound checks (integrity over outputs/)
# cannot run here — they live in hpc/nightly_integrity.sh on the loop host (cron).

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily (off the :00 thundering herd)
  workflow_dispatch: {}

# Least privilege: the jobs only read the repository (upload-artifact uses its own runtime token).
permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv (no cache — fresh-world on purpose)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv + install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint + types
        run: |
          uv run ruff check src tests hpc
          uv run ruff format --check src tests hpc
          uv run mypy src

      - name: Full test suite (excludes data_integrity)
        run: uv run pytest -q --cov=evemtbench

      - name: Audit builder determinism smoke (data-free)
        # Two builds must be byte-identical — the invariant the freshness gate rests on.
        run: |
          uv run python - <<'EOF'
          import sys
          sys.path.insert(0, "hpc")
          from make_audit import fresh_pages
          a, b = fresh_pages("outputs"), fresh_pages("outputs")
          assert a == b, "audit build is not deterministic"
          print(f"deterministic: {len(a)} pages")
          EOF
