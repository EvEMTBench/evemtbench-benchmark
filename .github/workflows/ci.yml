name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA (supply-chain hygiene); the trailing comment
# names the tag the SHA was resolved from — bump both together.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv (with dependency cache)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            requirements-ci-py*.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv + install from the hash-pinned CI lock (no heavy torch dep)
        # The lock is installed with --require-hashes so the gate is reproducible and a tampered
        # wheel cannot enter; the package itself is then installed --no-deps, because an editable
        # local path cannot be hash-pinned and its deps are already satisfied by the lock.
        # One lock per interpreter: uv resolves per --python-version, so a single hash-pinned file
        # cannot serve both legs. requirements-ci-py3.12.lock is additionally constrained to the
        # scoring-package versions of the results environment (env/results-scoring.constraints), so
        # that leg exercises the numerics the published results were computed with.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --require-hashes -r requirements-ci-py${{ matrix.python-version }}.lock
          uv pip install -e . --no-deps

      - name: Lint (ruff check + format)
        run: |
          uv run ruff check src tests hpc
          uv run ruff format --check src tests hpc

      - name: Types (mypy)
        run: uv run mypy src

      - name: Tests — unit, golden, schema, leakage, smoke (excludes data_integrity)
        # Torch-free CI: deep-baseline tests importorskip. The coverage floor lives in
        # pyproject [tool.coverage.report].fail_under (ratchet rule: CONTRIBUTING.md).
        run: uv run pytest -v --cov=evemtbench --cov-report=term-missing

      - name: Leakage audit — committed v0.2 splits + fixture regeneration
        # Already inside the pytest step above; re-run named so a leakage failure is legible in
        # the CI UI (seconds). Data-bound audits (splits.audit CLI, real-grid regeneration) stay
        # srun-only — no dataset is mounted here.
        run: uv run pytest tests/integration/test_leakage.py tests/integration/test_splits_audit.py -q

      - name: Publish rendered views (reviewers download without cloning)
        # The committed, freshness-gated views: the results-audit site, leaderboard, RESULTS
        # and the coverage snapshot. One matrix leg only (identical content on both).
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-views
          path: |
            audit/
            results/
            leaderboard.html
            RESULTS.md
            coverage_snapshot.json
          if-no-files-found: error
